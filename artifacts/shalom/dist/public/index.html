  <body>
    <div id="auth-bar" style="position:fixed;top:0;right:0;z-index:9999;padding:8px 16px;font-family:sans-serif;font-size:13px;color:#888;"></div>
    <div id="root"></div>
    <script>
      (async () => {
        const bar = document.getElementById('auth-bar');
        try {
          const res = await fetch('/member/status', { credentials: 'include' });
          const data = await res.json();
          if (data.authenticated) {
            bar.innerHTML = (data.email ?? '') + ' &nbsp;<a href="/auth/logout" style="color:#888;text-decoration:none;">Log out</a>';
          } else {
            bar.innerHTML = '<a href="https://bridget.fyi/auth/sso/init?return_to=' + encodeURIComponent('https://shalom.fyi/auth/sso/callback') + '" style="color:#888;text-decoration:none;">Sign in with Bridget \u2192</a>';
          }
        } catch {
          bar.innerHTML = '<a href="https://bridget.fyi/auth/sso/init?return_to=' + encodeURIComponent('https://shalom.fyi/auth/sso/callback') + '" style="color:#888;text-decoration:none;">Sign in with Bridget \u2192</a>';
        }
      })();
    </script>
